<div>
  <div class="panel define-groups-shell">
    <section class="define-groups-header">
      <app-expansion-panel-header [isOpenSignal]="addressHeaderPanel" [panelTitle]="'Address & Contact'">
      </app-expansion-panel-header>
    </section>

    <div class="from-grid form-grid-3-col gap-4" [class.p-4]="true">
      <input-select-option-field [frmGroup]="addressContactForm" [label]="'Address Type'" [controlName]="'addressType'"
        [options]="addressTypeOptions" />

      <input-select-option-field [frmGroup]="addressContactForm" [label]="'Country'" [controlName]="'country'"
        [options]="countries" />

      <input-select-option-field [frmGroup]="addressContactForm" [label]="'Division'" [controlName]="'division'"
        [options]="divisions" />

      <input-select-option-field [frmGroup]="addressContactForm" [label]="'District'" [controlName]="'district'"
        [options]="districts" />

      <input-select-option-field [frmGroup]="addressContactForm" [label]="'Thana'" [controlName]="'thana'"
        [options]="thanas" />

      <input-text-box [frmGroup]="addressContactForm" [label]="'City'" [controlName]="'city'" />

      <input-number [frmGroup]="addressContactForm" [label]="'Zip Code'" [controlName]="'zipCode'" [maxLen]="10" />

      <input-number [frmGroup]="addressContactForm" [label]="'Mobile No'" [controlName]="'mobileNo'" [maxLen]="11" />

      <input-text-box [frmGroup]="addressContactForm" [label]="'Email Address'" [controlName]="'email'"
        [type]="'email'" />

      <div class="span-3-col">
        <input-text-area [frmGroup]="addressContactForm" [label]="'Address'" [controlName]="'address'" [rows]="2" />
      </div>
    </div>
  </div>
</div>
